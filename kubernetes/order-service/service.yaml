apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecommerce
  annotations:
    cloud.google.com/backend-config: '{"default":"order-service-backendconfig"}'
spec:
  selector:
    app: order-service
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
  type: ClusterIP