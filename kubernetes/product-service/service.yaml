apiVersion: v1
kind: Service

metadata:
  name: product-service
  namespace: ecommerce
  annotations:
    cloud.google.com/backend-config: '{"default":"product-service-backendconfig"}'

spec:
  selector:
    app: product-service

  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000

  type: ClusterIP